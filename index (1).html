<style>
:root{--bg:#100d14;--s1:#1a1620;--s2:#252030;--line:#3b3243;--gold:#c9a24b;--gold2:#e8cb82;--tx:#ebe1ca;--mu:#a39886;--bad:#d04a3f;--ok:#62ae72;--str:#d1553f;--dex:#5fae6e;--con:#dc9440;--int:#4f8fd0;--wis:#9470cc;--cha:#d46f9f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% -10%,#2a1d38 0,var(--bg) 58%) fixed;color:var(--tx);font:16px/1.7 Cairo,system-ui,sans-serif;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Amiri,serif;margin:0;line-height:1.35;font-weight:700}
h1{font-size:30px}h2{font-size:24px}h3{font-size:20px}
a{color:var(--gold2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.bar{position:sticky;top:0;z-index:20;background:rgba(16,13,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
.bar .t{font:700 23px Amiri,serif;color:var(--gold2);flex:1}
.floor{border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:1px 14px;font-size:14px;white-space:nowrap}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;background:#130f18;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:9px 4px 8px;color:var(--mu);font-size:13px}
.nav a.on{color:var(--gold2);box-shadow:inset 0 2px 0 var(--gold)}
.nav svg{display:block;margin:0 auto 1px}
.card{background:linear-gradient(180deg,var(--s1),#151119);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:inset 0 0 0 3px #15111a,inset 0 0 0 4px #2d2535}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.muted{color:var(--mu)}.sm{font-size:14px}
.btn{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 16px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--gold)}
.btn.sm{min-height:34px;padding:2px 12px;font-size:14px}
.btn.gold{background:linear-gradient(#d9b45a,#a8812f);color:#1a1205;border-color:#e8cb82;font-weight:700}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.in{width:100%;background:#0f0c13;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.in:focus{border-color:var(--gold)}
label.f{display:block;margin:0 0 12px;font-size:14px;color:var(--mu)}
label.f .in{margin-top:4px;color:var(--tx);font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs .btn{flex:1}.tabs .btn.on{border-color:var(--gold);color:var(--gold2)}
.auth{max-width:420px;margin:7vh auto 0;padding:16px}
.auth h1{text-align:center;color:var(--gold2);font-size:40px;margin-bottom:4px}
.auth p.lead{text-align:center;color:var(--mu);margin:0 0 20px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#16121b;color:var(--tx);min-height:52px}
.list .it:hover{border-color:var(--gold)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.head h1{flex:1;min-width:0;overflow-wrap:anywhere}
.info{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 14px;background:#16121b}
.pill b{color:var(--gold2);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 8px 10px;text-align:center;background:#16121b}
.sigil{width:62px;height:62px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:2px solid var(--c);box-shadow:0 0 0 4px #16121b,0 0 0 5px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.stat .v{font:700 32px/1.1 Amiri,serif}
.stat .v small{font-size:19px;color:var(--gold2)}
.stat .n{font-size:15px}.stat .cap{font-size:12px;color:var(--mu)}
.stat .plus{position:absolute;top:6px;inset-inline-start:6px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.res .c{text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px;background:#16121b;font-size:13px;color:var(--mu);line-height:1.4}
.res .c svg{color:var(--gold)}.res b{display:block;font:700 28px Amiri,serif;color:var(--tx)}
.sec{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.sec h2{flex:1}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,3,8,.72);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--s1);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}}
.step{display:flex;gap:8px;align-items:center;margin-bottom:14px}.step .in{text-align:center;font-size:20px}.step .btn{min-width:48px}
.toast{position:fixed;inset:auto 16px calc(92px + env(safe-area-inset-bottom)) 16px;z-index:60;max-width:520px;margin:auto;padding:12px 16px;border-radius:12px;background:#2a2232;border:1px solid var(--gold);text-align:center}
.toast.bad{border-color:var(--bad)}
.empty{text-align:center;color:var(--mu);padding:24px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.it2{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#16121b}
.it2 .ds{white-space:pre-wrap;margin:6px 0 0;line-height:1.8;overflow-wrap:anywhere}
.pill.bad{border-color:var(--bad);background:rgba(208,74,63,.16);color:#ffb3aa}
.pill.bad b{color:#ffd0ca}
.dot{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #15111a;align-self:center}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(208,74,63,.3)}
.tv{position:relative;height:calc(100dvh - 370px);min-height:340px;border:1px solid var(--line);border-radius:14px;background:#0d0a11;overflow:hidden;touch-action:none;cursor:grab}
.tv svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.tv .tools{position:absolute;inset-block-end:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.ed{fill:none;stroke:var(--line);stroke-width:2.5}.ed.on{stroke:var(--gold);opacity:.55}
.nd{color:var(--c,var(--gold));cursor:pointer}
.nd circle{fill:#16121b;stroke:var(--c,var(--gold));stroke-width:2.5}
.nd .ring{fill:none;stroke-width:1.5;opacity:.7}
.nd.available:not(.buy) circle:first-child{stroke-dasharray:5 4}
.nd.buy circle:first-child{filter:drop-shadow(0 0 9px var(--c,var(--gold)))}
.nd.purchased{opacity:.5}
.nd text{fill:var(--tx);font:600 12px Cairo,sans-serif}
.rw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#16121b}
.rw .ds{white-space:pre-wrap;margin:6px 0 0;line-height:1.8;overflow-wrap:anywhere}
summary{cursor:pointer;font:700 20px Amiri,serif;color:var(--gold2);min-height:32px}
details.card[open] summary{margin-bottom:4px}
.arow{display:grid;grid-template-columns:70px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.arow .in{min-height:40px;padding:4px 8px;text-align:center}
.brow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#16121b}
.brow .in{min-height:40px;padding:4px 8px;text-align:center;flex:1;min-width:70px}
.lg{padding:6px 0;border-bottom:1px solid #2a2230}
.trow{border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--gold));border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#16121b}
.trow.del{opacity:.55}.trow.del b{text-decoration:line-through}
.chip{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:1.5px solid var(--c);flex:none}
.bdg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--mu)}
.tag.new{border-color:var(--ok);color:#a9dcb3}.tag.mod{border-color:var(--gold);color:var(--gold2)}.tag.rm{border-color:var(--bad);color:#ffb3aa}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
</style>
</head>

function authScreen(){
 if(stopWatch){stopWatch();stopWatch=null}
 let mode='in';
 const box=h('div',{class:'auth'});
 const draw=()=>{
  const u=h('input',{class:'in',autocomplete:'username',autocapitalize:'none',spellcheck:'false'});
  const p=h('input',{class:'in',type:'password',autocomplete:mode==='in'?'current-password':'new-password'});
  const p2=h('input',{class:'in',type:'password',autocomplete:'new-password'});
  const code=h('input',{class:'in',autocomplete:'off',autocapitalize:'characters',spellcheck:'false'});
  const codeBox=h('label',{class:'f',style:'display:none'},'رمز إعداد DMaster (يُستخدم مرة واحدة)',code);
  const btn=h('button',{class:'btn gold full',type:'button'},mode==='in'?'دخول':'إنشاء الحساب');
  u.addEventListener('input',()=>{codeBox.style.display=mode==='up'&&normU(u.value)==='dmaster'?'block':'none'});
  const submit=()=>act(btn,async()=>{
   const name=normU(u.value);
   if(mode==='up'){
    if(!/^[a-z0-9_.\u0600-\u06FF-]{3,24}$/.test(name))throw new Error('invalid_username');
    if(p.value.length<8||p.value.length>72)throw new Error('invalid_password');

   }
   await login(name,p.value);await boot()});
  btn.addEventListener('click',submit);
  box.replaceChildren(
   h('h1',null,'شجرة المسار'),h('p',{class:'lead'},'سجّل الدخول لتفتح ملف شخصيتك ومسارك.'),
   h('div',{class:'tabs',role:'tablist'},
    h('button',{class:'btn'+(mode==='in'?' on':''),type:'button',role:'tab','aria-selected':mode==='in',onclick:()=>{mode='in';draw()}},'دخول'),
    h('button',{class:'btn'+(mode==='up'?' on':''),type:'button',role:'tab','aria-selected':mode==='up',onclick:()=>{mode='up';draw()}},'حساب جديد')),
   h('div',{class:'card'},

    h('label',{class:'f'},'كلمة المرور',p),
    mode==='up'?h('label',{class:'f'},'تأكيد كلمة المرور',p2):null,
    mode==='up'?codeBox:null,
    btn,
    mode==='up'?h('p',{class:'muted sm',style:'margin:12px 0 0'},'اسم المستخدم هو هوية الدخول ولا يتغيّر. اسم اللاعب الظاهر في ملفك يمكنك تغييره متى شئت.'):null));
  [u,p,p2,code].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')submit()}))};
 $('#app').replaceChildren(box);draw()}

/* ---- path tree (player view) ---- */
const W_LEAF=104,H_LEVEL=132;
function layoutTree(nodes){
 const ids=new Set(nodes.map(n=>n.id)),kids={},roots=[];
 nodes.forEach(n=>{if(n.parent_id&&ids.has(n.parent_id))(kids[n.parent_id]=kids[n.parent_id]||[]).push(n);else roots.push(n)});
 const pos={};let leaf=0,maxD=0;
 const walk=(n,d)=>{maxD=Math.max(maxD,d);const c=kids[n.id]||[];let x;
  if(!c.length){x=leaf++*W_LEAF}else{c.forEach(k=>walk(k,d+1));x=(pos[c[0].id].x+pos[c[c.length-1].id].x)/2}
  pos[n.id]={x,y:d*H_LEVEL,n}};
 roots.forEach(r=>walk(r,0));
 const mx=Math.max(leaf-1,0)*W_LEAF;for(const id in pos)pos[id].x=mx-pos[id].x;
 return{pos,x0:-56,x1:Math.max(leaf-1,0)*W_LEAF+56,y0:-44,y1:maxD*H_LEVEL+72}}
const nodeIcon=i=>i==='points'?ICON.star:i==='health'?ICON.heart:i==='question'?ICON.q:ICON[i]||ICON.star;
const nodeColor=i=>({str:'var(--str)',dex:'var(--dex)',con:'var(--con)',int:'var(--int)',wis:'var(--wis)',cha:'var(--cha)'}[i]||'var(--gold)');
const shortName=s=>s.length>13?s.slice(0,12)+'…':s;
function treeMarkup(pos){
 let ed='',nd='';
 for(const id in pos){const p=pos[id],n=p.n,q=n.parent_id&&pos[n.parent_id];
  if(q)ed+=`<path class="ed${n.state==='purchased'?' on':''}" d="M${q.x} ${q.y+30}C${q.x} ${(q.y+p.y)/2} ${p.x} ${(q.y+p.y)/2} ${p.x} ${p.y-30}"/>`;
  nd+=`<g class="nd ${n.state}${n.can_buy?' buy':''}" data-id="${esc(n.id)}" transform="translate(${p.x} ${p.y})" style="--c:${nodeColor(n.icon)}" role="button" aria-label="${esc(n.name)}"><circle r="28"/>${n.state==='purchased'?'<circle class="ring" r="34"/>':''}<g transform="translate(-14 -14) scale(1.16)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${nodeIcon(n.icon)}</g><text y="52" text-anchor="middle">${esc(shortName(n.name))}</text></g>`}
 return ed+nd}
function panZoom(box,g,st,onTap){

 const apply=()=>g.setAttribute('transform',`translate(${st.x} ${st.y}) scale(${st.k})`);
 const zoomAt=(mx,my,f)=>{const k=Math.max(.25,Math.min(2.5,st.k*f)),r=k/st.k;st.x=mx-(mx-st.x)*r;st.y=my-(my-st.y)*r;st.k=k;apply()};

  if(pts.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;st.x+=dx;st.y+=dy;moved+=Math.abs(dx)+Math.abs(dy);apply()}
  else if(pts.size===2){const o=[...pts].find(([i])=>i!==e.pointerId)[1],d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y),r=box.getBoundingClientRect();if(d0>0)zoomAt((e.clientX+o.x)/2-r.left,(e.clientY+o.y)/2-r.top,d1/d0)}

   requestAnimationFrame(()=>mountTree(pbox,nodes,id=>{const n=nodes.find(x=>x.id===id);if(!n)return;sheet(n.name,h('div',null,h('p',null,h('b',null,TYPE_NAME[n.icon]),n.icon==='skill'?' · '+n.skill_name+' · المُعدل '+fmt(n.skill_modifier):n.reward_text?' · '+n.reward_text:''),n.description?h('p',{class:'ds',style:'white-space:pre-wrap'},n.description):null,h('p',{class:'muted'},'السعر: '+n.price+' نقطة شجرة')))}))}
  host.replaceChildren(...[
   h('div',{class:'card'},h('div',{class:'row',style:'flex-wrap:wrap;gap:8px'},pub,pbtn,h('button',{class:'btn',type:'button',onclick:()=>form(null,null),html:ic(ICON.plus,16)+' خيار أولي'})),
    h('p',{class:'muted sm',style:'margin:10px 0 0'},'ما تنشئه أو تعدّله يبقى مخفيًا عن اللاعبين حتى تضغط «نشر». في المعاينة، المتوهّج هو الجديد أو المعدّل.')),
   pbox,...(rows.length?rows:[h('p',{class:'empty'},'لا توجد انبثاقات بعد. ابدأ بإضافة الخيارات الأولية التي ستظهر للاعبين الجدد.')])].filter(Boolean))}
 view(h('div',null,h('div',{class:'sec'},h('h2',null,'محرر شجرة المسار'),h('a',{class:'btn sm',href:'#/admin'},'→ الإدارة')),host));
 await load()});
/* ---- boot ---- */
async function boot(){
 const{data:{session}}=await sb.auth.getSession();
 S.me=null;
 if(session){try{S.me=await rpc('me')}catch(e){}}
 if(!S.me){if(session)await sb.auth.signOut();return authScreen()}
 shell();go()}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){S.me=null;authScreen()}});
boot();
</script>
